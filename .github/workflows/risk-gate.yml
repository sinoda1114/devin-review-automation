name: Risk Gate

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: risk-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  risk-gate:
    name: Risk Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Risk Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/risk-gate.mjs
